name: Generate 0install bootstrap installer

# Produces VoiceBuddy-Setup.exe — a standalone installer that brings down 0install,
# subscribes the user to the VoiceBuddy feed, and pins the app. Regenerate only
# when the feed URI changes or you want to refresh the embedded 0install version.

on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Tag to upload the bootstrap EXE to (e.g. v0.2.0). Leave blank to only commit to docs/."
        required: false
        type: string

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 0install (Windows)
        shell: pwsh
        run: |
          choco install 0install -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install 0install failed" }
          # See release.yml — re-expose 0install on PATH for subsequent steps.
          $exe = Get-ChildItem -Path "C:\Program Files" -Filter "0install.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "0install.exe not found under C:\Program Files after choco install" }
          "$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Generate bootstrap EXE
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\VoiceBuddy-Setup.exe"
          # 0bootstrap (0install/0bootstrap-dotnet on Windows) downloads the
          # signed zero-install.exe template from get.0install.net and rewrites
          # its embedded BootstrapConfig.ini to pin our feed URI. Feed URI is
          # positional; --output sets the destination file.
          0install run --batch `
            https://apps.0install.net/0install/0bootstrap.xml `
            https://deejaytc.github.io/VoiceBuddy/voice-buddy.xml `
            --output="$out"
          if ($LASTEXITCODE -ne 0) { throw "0bootstrap failed" }
          if (-not (Test-Path $out)) { throw "Bootstrap EXE missing at $out" }
          Write-Host "Generated $out"

      - name: Attach to existing release (optional)
        if: ${{ inputs.attach_to_release != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.attach_to_release }}
          files: VoiceBuddy-Setup.exe
          fail_on_unmatched_files: true

      - name: Commit bootstrap to docs/
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item -Force VoiceBuddy-Setup.exe docs\VoiceBuddy-Setup.exe
          git config user.name "voicebuddy-release-bot"
          git config user.email "noreply@github.com"
          git add docs/VoiceBuddy-Setup.exe
          if (git diff --cached --quiet) {
            Write-Host "Bootstrap unchanged; nothing to commit."
            exit 0
          }
          git commit -m "chore: regenerate 0install bootstrap EXE"
          git push origin HEAD:main
