name: Release (Windows + 0install)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (without leading v, e.g. 0.2.0). Only used for manual dispatch."
        required: true
        type: string

permissions:
  contents: write  # create release, push docs/voice-buddy.xml back to main

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF.Substring("refs/tags/v".Length)
          } else {
            $v = "${{ inputs.version }}"
          }
          if (-not $v) { throw "Could not determine version." }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Releasing version $v"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore + publish (framework-dependent, win-x64)
        shell: pwsh
        run: |
          dotnet publish src/VoiceBuddy.App/VoiceBuddy.App.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Stage zip contents
        id: stage
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $zipName = "voice-buddy-$v-win-x64.zip"
          $zipPath = "$env:GITHUB_WORKSPACE\$zipName"
          # Flat archive: VoiceBuddy.exe sits at the archive root so the feed's
          # <command path="VoiceBuddy.exe"/> resolves without an extract= prefix.
          Compress-Archive -Path "publish\*" -DestinationPath $zipPath -Force
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release with zip asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VoiceBuddy ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: ${{ steps.stage.outputs.zip_path }}
          fail_on_unmatched_files: true

      - name: Install 0install (Windows)
        shell: pwsh
        run: |
          choco install 0install -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install 0install failed" }
          # choco updates the machine PATH via registry, but GitHub Actions
          # steps inherit env from the already-running runner process and do
          # not re-read the registry. Locate 0install.exe explicitly and
          # append its directory to GITHUB_PATH so the next step's fresh
          # shell can find it.
          $exe = Get-ChildItem -Path "C:\Program Files" -Filter "0install.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "0install.exe not found under C:\Program Files after choco install" }
          Write-Host "Resolved 0install at $($exe.FullName)"
          "$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Import GPG signing key and warm agent
        shell: pwsh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if (-not $env:GPG_PRIVATE_KEY) {
            throw "Secret GPG_PRIVATE_KEY is not set. See packaging/0install/README.md."
          }
          if (-not $env:GPG_PASSPHRASE) {
            throw "Secret GPG_PASSPHRASE is not set."
          }

          # gpg-agent config: allow loopback so we can feed the passphrase via
          # --passphrase-fd, and cache the passphrase for a day so later
          # signing calls (0repo add) don't re-prompt. Do NOT write a gpg.conf
          # with `pinentry-mode loopback` - that option lives on the command
          # line, not in gpg.conf, and older gnupg builds reject it there.
          $gpgConfDir = "$env:APPDATA\gnupg"
          New-Item -ItemType Directory -Force -Path $gpgConfDir | Out-Null
          @(
            "allow-loopback-pinentry",
            "default-cache-ttl 86400",
            "max-cache-ttl 86400"
          ) | Out-File -FilePath "$gpgConfDir\gpg-agent.conf" -Encoding ascii

          $keyPath = "$env:RUNNER_TEMP\signing.key"
          $env:GPG_PRIVATE_KEY | Out-File -FilePath $keyPath -Encoding ascii -NoNewline
          gpg --batch --yes --import $keyPath
          if ($LASTEXITCODE -ne 0) { throw "gpg import failed" }
          Remove-Item $keyPath -Force

          $fp = (gpg --list-secret-keys --with-colons |
            Select-String "^fpr" | Select-Object -First 1).Line.Split(':')[9]
          if (-not $fp) { throw "Could not determine GPG fingerprint after import." }
          "GPG_KEY_FP=$fp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Imported key $fp"

          # Warm gpg-agent's passphrase cache by performing one throwaway
          # signature. Write the passphrase to a temp file (no BOM, no
          # trailing newline) and feed it via --passphrase-file: piping the
          # env var into --passphrase-fd on Windows PowerShell appends CRLF,
          # which gpg then treats as part of the passphrase and rejects as
          # "Bad passphrase" even when the secret is correct.
          $passFile = "$env:RUNNER_TEMP\pp.txt"
          [System.IO.File]::WriteAllText($passFile, $env:GPG_PASSPHRASE.Trim())

          $warm    = "$env:RUNNER_TEMP\warmup.txt"
          $warmSig = "$env:RUNNER_TEMP\warmup.sig"
          "primer" | Out-File -FilePath $warm -Encoding ascii -NoNewline

          gpg --batch --yes --pinentry-mode loopback --passphrase-file $passFile `
            --local-user $fp --output $warmSig --detach-sign $warm
          $gpgExit = $LASTEXITCODE
          Remove-Item $passFile -Force -ErrorAction SilentlyContinue
          if ($gpgExit -ne 0) {
            throw "gpg-agent passphrase warmup failed (is GPG_PASSPHRASE correct?)"
          }
          Remove-Item $warm, $warmSig -Force -ErrorAction SilentlyContinue

      - name: Generate versioned feed from template
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $tpl = "packaging\0install\voice-buddy.xml.template"
          $today = Get-Date -Format "yyyy-MM-dd"
          # 0template requires every {placeholder} in the template to have a
          # value supplied on the command line (it does not auto-fill any).
          # After substitution it downloads the archive referenced by <archive
          # href="…"> and computes the manifest-digest.
          0install run --batch `
            https://apps.0install.net/0install/0template.xml `
            $tpl version=$v released=$today stability=stable
          if ($LASTEXITCODE -ne 0) { throw "0template failed" }
          # 0template writes the generated feed next to the template, not in
          # the working directory. Move it to the workspace root so downstream
          # steps (and the release-asset upload) find it at a stable path.
          $from = "packaging\0install\voice-buddy-$v.xml"
          $to   = "voice-buddy-$v.xml"
          if (-not (Test-Path $from)) {
            throw "0template did not produce $from"
          }
          Move-Item -Force $from $to
          Write-Host "Generated $to"

      - name: Install 0repo and zeroinstall from source
        shell: pwsh
        run: |
          # 0repo has no setup.py/pyproject.toml at the root, so plain
          # `pip install git+...` fails. Its one runtime dep is the
          # `zeroinstall` Python library, which isn't on PyPI but ships as
          # a tarball with a real setup.py on the 0install repo releases.
          # Install zeroinstall via pip, clone 0repo's sources, then drop
          # a .cmd shim on PATH so downstream steps can keep calling
          # `0repo ...` unchanged. This sidesteps `0install run 0repo.xml`
          # entirely, so imports and signing go through one keyring
          # (system Gpg4win).
          $ziVer  = "2.3.17"
          $ziRoot = "C:\zi"
          New-Item -ItemType Directory -Force -Path $ziRoot | Out-Null

          $tarball = "$ziRoot\zi.tar.bz2"
          Invoke-WebRequest `
            "https://github.com/0install/0install/releases/download/v$ziVer/0install-python-$ziVer.tar.bz2" `
            -OutFile $tarball
          tar -xjf $tarball -C $ziRoot
          if ($LASTEXITCODE -ne 0) { throw "failed to extract zeroinstall tarball" }

          git clone --depth 1 https://github.com/0install/0repo.git "$ziRoot\0repo"
          if ($LASTEXITCODE -ne 0) { throw "git clone 0repo failed" }

          python -m pip install --upgrade pip
          python -m pip install "$ziRoot\0install-python-$ziVer"
          if ($LASTEXITCODE -ne 0) { throw "zeroinstall pip install failed" }

          $binDir = "$ziRoot\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          @(
            '@echo off',
            "python $ziRoot\0repo\0repo.py %*"
          ) | Set-Content -Path "$binDir\0repo.cmd" -Encoding ascii
          Add-Content $env:GITHUB_PATH $binDir
          Write-Host "0repo shim written to $binDir\0repo.cmd"

      - name: Prepare 0repo state (first run only)
        shell: pwsh
        run: |
          $repo = "packaging\0install\repo"
          if (-not (Test-Path "$repo\0repo-config.py")) {
            # `0repo create` requires the target dir to NOT exist.
            if (Test-Path $repo) { Remove-Item -Recurse -Force $repo }
            0repo create $repo "$env:GPG_KEY_FP"
            if ($LASTEXITCODE -ne 0) { throw "0repo create failed" }
            # Overlay our committed config on top of the generated skeleton so
            # settings like REPOSITORY_BASE_URL match this repo.
            Copy-Item -Force packaging\0install\0repo-config.py "$repo\0repo-config.py"
          }

      - name: Add implementation to feed via 0repo
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $generated = "$env:GITHUB_WORKSPACE\voice-buddy-$v.xml"
          Push-Location packaging\0install\repo
          0repo add $generated
          if ($LASTEXITCODE -ne 0) { throw "0repo add failed" }
          Pop-Location

      - name: Publish merged feed to docs/
        shell: pwsh
        run: |
          $src = "packaging\0install\repo\public\voice-buddy.xml"
          if (-not (Test-Path $src)) { throw "Merged feed missing at $src" }
          Copy-Item -Force $src docs\voice-buddy.xml

      - name: Upload versioned feed as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: voice-buddy-${{ steps.version.outputs.version }}.xml

      - name: Generate VoiceBuddy-Setup.exe via 0bootstrap
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\VoiceBuddy-Setup.exe"
          # 0bootstrap downloads the signed zero-install.exe template from
          # get.0install.net and rewrites its embedded BootstrapConfig.ini so
          # the EXE subscribes the end user to our feed on first run. Runs
          # after the feed publish step so get.0install.net and our feed are
          # both resolvable.
          0install run --batch `
            https://apps.0install.net/0install/0bootstrap.xml `
            https://deejaytc.github.io/VoiceBuddy/voice-buddy.xml `
            --output="$out"
          if ($LASTEXITCODE -ne 0) { throw "0bootstrap failed" }
          if (-not (Test-Path $out)) { throw "Bootstrap EXE missing at $out" }

      - name: Upload bootstrap EXE as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: VoiceBuddy-Setup.exe
          fail_on_unmatched_files: true

      - name: Commit updated feed + 0repo state back to main
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "voicebuddy-release-bot"
          git config user.email "noreply@github.com"
          # Commit the merged public feed and the 0repo state (feeds/, public/,
          # feed-keys/). Keeping the state in-repo is what lets the *next* release
          # merge-on-top rather than overwriting history.
          git add docs/voice-buddy.xml
          git add packaging/0install/repo/feeds/
          git add packaging/0install/repo/public/
          git add packaging/0install/repo/feed-keys/
          if (git diff --cached --quiet) {
            Write-Host "No feed changes to commit."
            exit 0
          }
          git commit -m "chore(release): publish voice-buddy.xml for v${{ steps.version.outputs.version }}"
          # Tag pushes detach HEAD, so target main explicitly.
          git push origin HEAD:main
