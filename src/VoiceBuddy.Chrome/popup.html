<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DeepL Voice Buddy</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { padding: 14px 14px 12px; width: 280px; }
    .brand-header { margin-bottom: 14px; }
    .footer { margin-top: 14px; display: flex; justify-content: flex-end; }
    .link-btn { font-size: 11px; color: var(--accent); cursor: pointer; }
    .link-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="brand-header">
    <span class="logo-badge"><img src="icons/icon32.png" alt="" /></span>
    <h1 class="brand-title"><span class="brand-accent">DeepL</span> Voice Buddy</h1>
  </div>

  <label class="field-label" for="sourceLang">From</label>
  <select id="sourceLang">
    <option value="auto">Auto-detect</option>
    <option value="en">English</option>
    <option value="de">German</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
    <option value="it">Italian</option>
    <option value="ja">Japanese</option>
    <option value="zh">Chinese</option>
    <option value="pt">Portuguese</option>
    <option value="nl">Dutch</option>
    <option value="pl">Polish</option>
    <option value="ru">Russian</option>
  </select>

  <label class="field-label" for="targetLang">Output language</label>
  <select id="targetLang">
    <option value="EN-US">English (US)</option>
    <option value="EN-GB">English (UK)</option>
    <option value="DE">German</option>
    <option value="FR">French</option>
    <option value="ES">Spanish</option>
    <option value="IT">Italian</option>
    <option value="JA">Japanese</option>
    <option value="ZH">Chinese</option>
    <option value="PT-BR">Portuguese (BR)</option>
    <option value="PT-PT">Portuguese (PT)</option>
    <option value="NL">Dutch</option>
    <option value="PL">Polish</option>
    <option value="RU">Russian</option>
  </select>

  <hr class="divider" />

  <label class="check"><input type="checkbox" id="captionsEnabled" />Show captions</label>
  <label class="check sub" id="showOriginalWrap"><input type="checkbox" id="showOriginal" />Also show original text</label>
  <label class="check"><input type="checkbox" id="voiceOutEnabled" />Play translated audio</label>

  <button id="toggle" class="primary" style="margin-top: 16px;">Start</button>
  <div class="status" id="status"></div>

  <div class="footer"><a class="link-btn" id="openOptions">Settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
