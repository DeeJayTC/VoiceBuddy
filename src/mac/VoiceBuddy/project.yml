name: VoiceBuddy
options:
  bundleIdPrefix: com.deepl.voicebuddy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: VoiceBuddy
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  VoiceBuddy:
    type: application
    platform: macOS
    sources:
      - path: VoiceBuddy
        excludes:
          - "Info.plist"
          - "VoiceBuddy.entitlements"
    info:
      path: VoiceBuddy/Info.plist
    entitlements:
      path: VoiceBuddy/VoiceBuddy.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepl.voicebuddy
        INFOPLIST_FILE: VoiceBuddy/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoiceBuddy/VoiceBuddy.entitlements
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
